[project]
name = "loarchive"
version = "1.2.0-dev.1"
description = "LoArchive - Lofter & AO3 content archiving tool"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["loarchive", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # line length handled by review; spider regexes/templates are long
    "B008",   # FastAPI Depends(...) idiom
]

[tool.ruff.lint.isort]
known-first-party = ["loarchive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 让 `pytest` 控制台脚本也能找到 loarchive 包（`python -m pytest` 会隐式加入当前目录，
# 但 CI 使用的是控制台脚本，不设置此项会直接 ModuleNotFoundError）
pythonpath = ["."]
