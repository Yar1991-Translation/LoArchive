name: Release

on:
  push:
    branches:
      - master
    # pre-release（dev/beta/rc）通过打 tag 触发，无需合并到 master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'

  # 允许在 Actions 页面手动重跑发布
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync version from loarchive/__init__.py
        run: python scripts/sync_version.py

      - name: Get version from tauri.conf.json
        id: version
        run: |
          $VERSION = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

          # 版本号含 "-"（如 1.2.0-dev.1）时发布为 pre-release
          $IS_PRERELEASE = if ($VERSION -match '-') { 'true' } else { 'false' }
          echo "prerelease=$IS_PRERELEASE" >> $env:GITHUB_OUTPUT
          echo "Pre-release: $IS_PRERELEASE"
        shell: pwsh

      - name: Get commit messages since last tag
        id: changelog
        run: |
          # 用 HEAD^ 取「上一个」tag：在 tag 触发的运行里，HEAD 自身就是本次 tag，
          # 直接 git describe 会拿到自己，导致变更列表为空。
          $LAST_TAG = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($LAST_TAG) {
            $COMMITS = git log "$LAST_TAG..HEAD" --pretty=format:"- %s"
            echo "changelog base: $LAST_TAG"
          } else {
            $COMMITS = git log --pretty=format:"- %s" -20
            echo "changelog base: none (using last 20 commits)"
          }
          if (-not $COMMITS) { $COMMITS = "- Initial release" }
          echo "commits<<EOF" >> $env:GITHUB_OUTPUT
          echo $COMMITS >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Compose release body
        id: body
        run: |
          # 版本专属发布说明（docs/release-notes/<version>.md），缺失时退回提交列表；
          # 提交列表在本步骤内直接读取 git，避免多行输出插值破坏脚本
          $VERSION = "${{ steps.version.outputs.version }}"
          $NOTES_FILE = "docs/release-notes/$VERSION.md"
          $BODY = ""
          if (Test-Path $NOTES_FILE) {
            $BODY += (Get-Content $NOTES_FILE -Raw)
            $BODY += "`n---`n`n"
          }
          $LAST_TAG = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($LAST_TAG) {
            $COMMITS = git log "$LAST_TAG..HEAD" --pretty=format:"- %s"
          } else {
            $COMMITS = git log --pretty=format:"- %s" -20
          }
          if (-not $COMMITS) { $COMMITS = @("- Initial release") }
          $BODY += "<details><summary>📝 完整提交记录</summary>`n`n"
          $BODY += ($COMMITS -join "`n")
          $BODY += "`n</details>`n"
          $BODY += "`n---`n`n<sub>构建时间: ${{ github.event.head_commit.timestamp }}</sub>"
          echo "body<<BODYEOF" >> $env:GITHUB_OUTPUT
          echo $BODY >> $env:GITHUB_OUTPUT
          echo "BODYEOF" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install Node dependencies
        run: npm ci

      - name: Build backend
        run: python scripts/build_backend.py

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: 'LoArchive v${{ steps.version.outputs.version }}'
          releaseBody: ${{ steps.body.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
