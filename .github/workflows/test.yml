name: Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest -q

      - name: Typecheck frontend (vue-tsc)
        run: npx vue-tsc -b

      - name: Test frontend (vitest)
        run: npx vitest run
